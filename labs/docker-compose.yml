services:
  db:
    image: postgres:17
    container_name: ventora-labs-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localpass
      POSTGRES_DB: ventora_labs
    ports:
      - "5432:5432"
    volumes:
      - ventora_labs_data:/var/lib/postgresql/data
      - ./experiments:/experiments:ro

volumes:
  ventora_labs_data:
