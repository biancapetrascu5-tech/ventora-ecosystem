<title>Ventora</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--sheet); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .slab { fill:var(--ink); }
  .peach { fill:var(--attention); }
  .lime { fill:var(--done); }
  .tint { fill:var(--selected); }
  .lg { rx:var(--radius-lg); }
  .sm { rx:var(--radius-sm); }
  .cut { fill:none; stroke:var(--sheet); stroke-width:var(--marker-width); stroke-linejoin:miter; stroke-linecap:square; }
  .cut2 { fill:none; stroke:var(--on-attention); stroke-width:var(--border-width-control); stroke-linejoin:miter; }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0 0 0 calc(var(--space-2) * -1); line-height:0; }
  .name svg { display:block; }
  .vh { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .tag { margin:var(--space-2) 0 0 0; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>

  blocks      ink slab 176×240 bled off the top (navy in light, off-white in dark: the structure colour) · attention 144×144 (peach, "now") · done 64×32 once (lime only ever means confirmed) · selected 128×192 bleeding off the right edge — ≈ 38% of 960×288
  arrangement one tall slab with satellites, bottoms on one line space-16 above the edge, space-4 gutters
  pattern     chevrons, from the mark's two fox-ear Vs and "precision, not decoration": four nested Vs at a space-4 pitch cut into the slab in the ground colour, two hairline Vs in on-attention across the peach block
  scales      sides in space-4 multiples; gutters space-4; pitch space-4; corners radius-lg, the lime chip radius-sm; strokes marker-width and border-width-control
