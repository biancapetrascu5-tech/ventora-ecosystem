name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore: ['docs/**', '**/*.md', 'screenshots/**', 'reports/**']
  pull_request:
    branches: [main, develop]
    paths-ignore: ['docs/**', '**/*.md', 'screenshots/**', 'reports/**']

# Un push nou pe același branch / PR anulează rularea veche (economie de minute).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  NODE_ENV: test

jobs:
  secrets-scan:
    name: Scan for secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  guards-verify:
    name: Verify architectural guards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install gitleaks v8.30.1
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar xz -C /usr/local/bin gitleaks
          gitleaks version
      - run: pnpm install --frozen-lockfile
      - run: pnpm guards:verify

  quality:
    name: Lint · Typecheck · Format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ventora/identity generate
      - run: pnpm --filter @ventora/organizations generate
      - run: pnpm --filter @ventora/access generate
      - run: pnpm lint
      # Lot 2.8: o cheie lipsă (sau în plus) într-o limbă pică CI-ul, nu doar pre-push-ul local.
      - name: i18n:check
        run: pnpm i18n:check
      - run: pnpm typecheck
      - run: pnpm format:check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration-tests:
    name: Integration tests (T1 + T2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ventora_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ventora/db-kit test:integration
        env:
          DATABASE_URL_TEST: postgresql://postgres:test@localhost:5432/ventora_test

  integration-tests-identity:
    name: Integration tests (identity — T1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ventora_identity_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ventora/identity generate
      - name: Verify identity + founder schemas match migrations
        run: |
          PSQL="psql postgresql://postgres:test@localhost:5433/ventora_identity_test"
          $PSQL -c "CREATE DATABASE shadow_identity_diff"
          $PSQL -c "CREATE DATABASE shadow_founder_diff"
          SHADOW_DATABASE_URL="postgresql://postgres:test@localhost:5433/shadow_identity_diff" \
          pnpm --filter @ventora/identity exec prisma migrate diff \
            --from-migrations ./prisma/identity/migrations \
            --to-schema ./prisma/identity/schema.prisma \
            --exit-code \
            --config prisma7.config.ts
          SHADOW_DATABASE_URL="postgresql://postgres:test@localhost:5433/shadow_founder_diff" \
          pnpm --filter @ventora/identity exec prisma migrate diff \
            --from-migrations ./prisma/founder/migrations \
            --to-schema ./prisma/founder/schema.prisma \
            --exit-code \
            --config prisma7.config.ts
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5433/ventora_identity_test
      - name: Generate test secrets
        run: |
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "FOUNDER_AUTH_SECRET=$(openssl rand -hex 32)" >> $GITHUB_ENV
      - name: Apply identity migration
        run: pnpm --filter @ventora/identity db:migrate:identity
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5433/ventora_identity_test
      - name: Apply founder migration
        run: pnpm --filter @ventora/identity db:migrate:founder
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5433/ventora_identity_test
      # Hooks and founder contracts write audit rows (app_runtime / founder_runtime → audit_writer)
      - name: Apply audit migration
        run: |
          psql postgresql://postgres:test@localhost:5433/ventora_identity_test \
            -v ON_ERROR_STOP=1 \
            -f core/audit/prisma/migrations/20261028000001_audit_init/migration.sql
      - name: Set runtime role passwords and start pgbouncer
        run: |
          APP_PW=$(openssl rand -hex 32)
          FOUNDER_PW=$(openssl rand -hex 32)
          PSQL="psql postgresql://postgres:test@localhost:5433/ventora_identity_test"
          $PSQL -c "ALTER ROLE app_runtime WITH PASSWORD '${APP_PW}'"
          $PSQL -c "ALTER ROLE founder_runtime WITH PASSWORD '${FOUNDER_PW}'"

          # Install pgbouncer for transaction-pooler isolation test (T1.14)
          sudo apt-get install -y pgbouncer
          # apt starts the system pgbouncer service on port 6432 via systemd — stop it
          # so our custom instance can bind the same port.
          sudo systemctl stop pgbouncer || true

          # pgbouncer 1.22+ (ubuntu noble) requires auth_file even for auth_type=trust.
          # List app_runtime with its plaintext password so pgbouncer can also use it
          # for SCRAM-SHA-256 server-side auth (PostgreSQL 17 default).
          printf '"app_runtime" "%s"\n' "${APP_PW}" > /tmp/pgbouncer_users.txt

          cat > /tmp/pgbouncer.ini << PBEOF
          [databases]
          ventora_identity_test = host=127.0.0.1 port=5433 dbname=ventora_identity_test user=app_runtime

          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = 6432
          auth_type = trust
          auth_file = /tmp/pgbouncer_users.txt
          pool_mode = transaction
          max_client_conn = 100
          default_pool_size = 10
          pidfile = /tmp/pgbouncer.pid
          PBEOF

          pgbouncer -d /tmp/pgbouncer.ini
          sleep 2
          # Fail fast if pgbouncer is not accepting connections
          psql "postgresql://app_runtime:${APP_PW}@localhost:6432/ventora_identity_test" -c "SELECT 1" || { echo "pgbouncer health-check failed"; cat /tmp/pgbouncer.ini; exit 1; }

          echo "DATABASE_URL_TEST=postgresql://app_runtime:${APP_PW}@localhost:5433/ventora_identity_test" >> $GITHUB_ENV
          echo "DATABASE_URL_FOUNDER_TEST=postgresql://founder_runtime:${FOUNDER_PW}@localhost:5433/ventora_identity_test" >> $GITHUB_ENV
          echo "DATABASE_URL_APP_RUNTIME=postgresql://app_runtime:${APP_PW}@localhost:5433/ventora_identity_test" >> $GITHUB_ENV
          echo "DATABASE_URL_PGBOUNCER_TEST=postgresql://app_runtime:${APP_PW}@localhost:6432/ventora_identity_test" >> $GITHUB_ENV
          echo "DATABASE_URL_ADMIN_TEST=postgresql://postgres:test@localhost:5433/ventora_identity_test" >> $GITHUB_ENV
      - run: pnpm --filter @ventora/identity test:integration
        env:
          BETTER_AUTH_SECRET: ${{ env.BETTER_AUTH_SECRET }}
          FOUNDER_AUTH_SECRET: ${{ env.FOUNDER_AUTH_SECRET }}
          DATABASE_URL_TEST: ${{ env.DATABASE_URL_TEST }}
          DATABASE_URL_FOUNDER_TEST: ${{ env.DATABASE_URL_FOUNDER_TEST }}
          DATABASE_URL_APP_RUNTIME: ${{ env.DATABASE_URL_APP_RUNTIME }}
          DATABASE_URL_PGBOUNCER_TEST: ${{ env.DATABASE_URL_PGBOUNCER_TEST }}
          DATABASE_URL_ADMIN_TEST: ${{ env.DATABASE_URL_ADMIN_TEST }}

  integration-tests-organizations:
    name: Integration tests (organizations — T2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ventora_org_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5434:5432
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ventora/organizations generate
      - name: Verify organizations schema matches migrations
        run: |
          PSQL="psql postgresql://postgres:test@localhost:5434/ventora_org_test"
          $PSQL -c "CREATE DATABASE shadow_org_diff"
          SHADOW_DATABASE_URL="postgresql://postgres:test@localhost:5434/shadow_org_diff" \
          pnpm --filter @ventora/organizations exec prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema ./prisma/schema.prisma \
            --exit-code \
            --config prisma7.config.ts
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5434/ventora_org_test
      - name: Create runtime roles
        run: |
          APP_PW=$(openssl rand -hex 32)
          FOUNDER_PW=$(openssl rand -hex 32)
          PSQL="psql postgresql://postgres:test@localhost:5434/ventora_org_test"
          $PSQL -c "CREATE ROLE app_runtime WITH LOGIN PASSWORD '${APP_PW}' NOINHERIT"
          $PSQL -c "CREATE ROLE founder_runtime WITH LOGIN PASSWORD '${FOUNDER_PW}' NOINHERIT"
          echo "APP_PW=${APP_PW}" >> $GITHUB_ENV
          echo "FOUNDER_PW=${FOUNDER_PW}" >> $GITHUB_ENV
      - name: Apply organizations migrations
        run: |
          PSQL="psql postgresql://postgres:test@localhost:5434/ventora_org_test"
          $PSQL -f core/organizations/prisma/migrations/20261027000001_organizations_init/migration.sql
          $PSQL -f core/organizations/prisma/migrations/20261027000003_invitation_application_ids/migration.sql
          $PSQL -v ON_ERROR_STOP=1 -f core/organizations/prisma/migrations/20261028000003_founder_owner_lookup/migration.sql
          $PSQL -v ON_ERROR_STOP=1 -f core/organizations/prisma/migrations/20261029000005_lot26_invitation_view/migration.sql
          $PSQL -v ON_ERROR_STOP=1 -f core/organizations/prisma/migrations/20261031000001_lot28_organization_status/migration.sql
          $PSQL -v ON_ERROR_STOP=1 -f core/organizations/prisma/migrations/20261031000002_outbox_init/migration.sql
          $PSQL -v ON_ERROR_STOP=1 -f core/organizations/prisma/migrations/20261101000001_lot29b_memberships_v3/migration.sql
          # Lot 4.3: the first consumer (invitation.new_link_requested) writes notifications
          $PSQL -v ON_ERROR_STOP=1 -f core/notifications/prisma/migrations/20261101000008_notifications_init/migration.sql
      - name: Apply audit migration
        run: |
          psql postgresql://postgres:test@localhost:5434/ventora_org_test \
            -v ON_ERROR_STOP=1 \
            -f core/audit/prisma/migrations/20261028000001_audit_init/migration.sql
      - name: Run organizations integration tests
        env:
          DATABASE_URL_TEST: postgresql://app_runtime:${{ env.APP_PW }}@localhost:5434/ventora_org_test
          DATABASE_URL_FOUNDER_TEST: postgresql://founder_runtime:${{ env.FOUNDER_PW }}@localhost:5434/ventora_org_test
          DATABASE_URL_ADMIN_TEST: postgresql://postgres:test@localhost:5434/ventora_org_test
        run: pnpm --filter @ventora/organizations test:integration
      - name: Run outbox integration tests (integrations — T6)
        env:
          DATABASE_URL_TEST: postgresql://app_runtime:${{ env.APP_PW }}@localhost:5434/ventora_org_test
          DATABASE_URL_FOUNDER_TEST: postgresql://founder_runtime:${{ env.FOUNDER_PW }}@localhost:5434/ventora_org_test
          DATABASE_URL_ADMIN_TEST: postgresql://postgres:test@localhost:5434/ventora_org_test
        run: pnpm --filter @ventora/integrations test:integration

  integration-tests-access:
    name: Integration tests (access + booking — T3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ventora_access_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5435:5432
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ventora/identity generate
      - run: pnpm --filter @ventora/organizations generate
      - run: pnpm --filter @ventora/access generate
      - name: Verify access schema matches migrations
        run: |
          psql postgresql://postgres:test@localhost:5435/ventora_access_test -c "CREATE DATABASE shadow_access_diff"
          SHADOW_DATABASE_URL="postgresql://postgres:test@localhost:5435/shadow_access_diff" \
          pnpm --filter @ventora/access exec prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema ./prisma/schema.prisma \
            --exit-code \
            --config prisma7.config.ts
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5435/ventora_access_test
      - name: Create runtime roles
        run: |
          APP_PW=$(openssl rand -hex 32)
          FOUNDER_PW=$(openssl rand -hex 32)
          PSQL="psql postgresql://postgres:test@localhost:5435/ventora_access_test"
          $PSQL -c "CREATE ROLE app_runtime WITH LOGIN PASSWORD '${APP_PW}' NOINHERIT"
          $PSQL -c "CREATE ROLE founder_runtime WITH LOGIN PASSWORD '${FOUNDER_PW}' NOINHERIT"
          echo "APP_PW=${APP_PW}" >> $GITHUB_ENV
          echo "FOUNDER_PW=${FOUNDER_PW}" >> $GITHUB_ENV
      - name: Apply identity migrations
        run: |
          PSQL="psql postgresql://postgres:test@localhost:5435/ventora_access_test"
          for f in core/identity/prisma/identity/migrations/*/migration.sql; do
            echo "Applying $f"
            $PSQL -f "$f"
          done
          for f in core/identity/prisma/founder/migrations/*/migration.sql; do
            echo "Applying $f"
            $PSQL -f "$f"
          done
      - name: Apply organizations migrations
        run: |
          PSQL="psql postgresql://postgres:test@localhost:5435/ventora_access_test"
          for f in core/organizations/prisma/migrations/*/migration.sql; do
            echo "Applying $f"
            $PSQL -f "$f"
          done
      - name: Apply access migrations
        run: |
          PSQL="psql postgresql://postgres:test@localhost:5435/ventora_access_test -v ON_ERROR_STOP=1"
          $PSQL -f core/access/prisma/migrations/20261027000002_access_init/migration.sql
          $PSQL -f core/access/prisma/migrations/20261028000002_support_session/migration.sql
          $PSQL -f core/access/prisma/migrations/20261029000007_lot26_founder_open_session/migration.sql
          $PSQL -f core/access/prisma/migrations/20261030000001_lot27_support_one_per_org/migration.sql
      - name: Apply audit migration
        run: |
          psql postgresql://postgres:test@localhost:5435/ventora_access_test \
            -v ON_ERROR_STOP=1 \
            -f core/audit/prisma/migrations/20261028000001_audit_init/migration.sql
      # Lot 3.2: T4 in booking reads the subscription through the real provider (commercial)
      - name: Apply commercial migrations
        run: |
          PSQL="psql postgresql://postgres:test@localhost:5435/ventora_access_test -v ON_ERROR_STOP=1"
          for f in core/commercial/prisma/migrations/*/migration.sql; do
            echo "Applying $f"
            $PSQL -f "$f"
          done
      # Lot 4.3: the notifications (schema notifications, role notifications_rw)
      - name: Apply notifications migrations
        run: |
          PSQL="psql postgresql://postgres:test@localhost:5435/ventora_access_test -v ON_ERROR_STOP=1"
          for f in core/notifications/prisma/migrations/*/migration.sql; do
            echo "Applying $f"
            $PSQL -f "$f"
          done
      - name: Sync permissions
        run: pnpm tsx scripts/sync-permissions.ts
        env:
          DIRECT_URL: postgresql://postgres:test@localhost:5435/ventora_access_test
      - name: Sync the commercial registry
        run: pnpm tsx scripts/sync-commercial-registry.ts
        env:
          DIRECT_URL: postgresql://postgres:test@localhost:5435/ventora_access_test
      - name: Generate test secrets
        run: |
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "FOUNDER_AUTH_SECRET=$(openssl rand -hex 32)" >> $GITHUB_ENV
      - name: Run access integration tests
        env:
          DATABASE_URL_TEST: postgresql://app_runtime:${{ env.APP_PW }}@localhost:5435/ventora_access_test
          DATABASE_URL_ADMIN_TEST: postgresql://postgres:test@localhost:5435/ventora_access_test
          DATABASE_URL: postgresql://app_runtime:${{ env.APP_PW }}@localhost:5435/ventora_access_test
          # Lot 2.5c: support sessions and owner recovery run on founder_runtime
          DATABASE_URL_FOUNDER_TEST: postgresql://founder_runtime:${{ env.FOUNDER_PW }}@localhost:5435/ventora_access_test
          BETTER_AUTH_SECRET: ${{ env.BETTER_AUTH_SECRET }}
          FOUNDER_AUTH_SECRET: ${{ env.FOUNDER_AUTH_SECRET }}
        run: |
          pnpm --filter @ventora/access test:integration
          pnpm --filter @ventora/booking test:integration
      - name: Verify notifications schema matches migrations
        run: |
          psql postgresql://postgres:test@localhost:5435/ventora_access_test -c "CREATE DATABASE shadow_notifications_diff"
          SHADOW_DATABASE_URL="postgresql://postgres:test@localhost:5435/shadow_notifications_diff" \
          pnpm --filter @ventora/notifications exec prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema ./prisma/schema.prisma \
            --exit-code \
            --config prisma7.config.ts
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5435/ventora_access_test
      - name: Run notifications integration tests
        env:
          DATABASE_URL_TEST: postgresql://app_runtime:${{ env.APP_PW }}@localhost:5435/ventora_access_test
          DATABASE_URL_ADMIN_TEST: postgresql://postgres:test@localhost:5435/ventora_access_test
        run: pnpm --filter @ventora/notifications test:integration

  integration-tests-audit:
    name: Integration tests (audit — TA)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ventora_audit_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5436:5432
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify audit schema matches migrations
        run: |
          psql postgresql://postgres:test@localhost:5436/ventora_audit_test -c "CREATE DATABASE shadow_audit_diff"
          SHADOW_DATABASE_URL="postgresql://postgres:test@localhost:5436/shadow_audit_diff" \
          pnpm --filter @ventora/audit exec prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema ./prisma/schema.prisma \
            --exit-code \
            --config prisma7.config.ts
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5436/ventora_audit_test
      # Roles first: M1 grants audit_writer / audit_*_reader only to runtime roles that exist
      - name: Create runtime roles
        run: |
          APP_PW=$(openssl rand -hex 32)
          FOUNDER_PW=$(openssl rand -hex 32)
          PSQL="psql postgresql://postgres:test@localhost:5436/ventora_audit_test"
          $PSQL -c "CREATE ROLE app_runtime WITH LOGIN PASSWORD '${APP_PW}' NOINHERIT"
          $PSQL -c "CREATE ROLE founder_runtime WITH LOGIN PASSWORD '${FOUNDER_PW}' NOINHERIT"
          echo "APP_PW=${APP_PW}" >> $GITHUB_ENV
          echo "FOUNDER_PW=${FOUNDER_PW}" >> $GITHUB_ENV
      - name: Apply audit migration
        run: |
          psql postgresql://postgres:test@localhost:5436/ventora_audit_test \
            -v ON_ERROR_STOP=1 \
            -f core/audit/prisma/migrations/20261028000001_audit_init/migration.sql
      - name: Run audit integration tests
        env:
          DATABASE_URL_TEST: postgresql://app_runtime:${{ env.APP_PW }}@localhost:5436/ventora_audit_test
          DATABASE_URL_FOUNDER_TEST: postgresql://founder_runtime:${{ env.FOUNDER_PW }}@localhost:5436/ventora_audit_test
          DATABASE_URL_ADMIN_TEST: postgresql://postgres:test@localhost:5436/ventora_audit_test
        run: pnpm --filter @ventora/audit test:integration

  # Lot 3.1–3.2: registrul și modelul comercial (T9: migrările commercial pe o bază curată, fără drift)
  integration-tests-commercial:
    name: Integration tests (commercial — registrul)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ventora_commercial_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5437:5432
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify commercial schema matches migrations
        run: |
          psql postgresql://postgres:test@localhost:5437/ventora_commercial_test -c "CREATE DATABASE shadow_commercial_diff"
          SHADOW_DATABASE_URL="postgresql://postgres:test@localhost:5437/shadow_commercial_diff" \
          pnpm --filter @ventora/commercial exec prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema ./prisma/schema.prisma \
            --exit-code \
            --config prisma7.config.ts
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5437/ventora_commercial_test
      # Roles first: commercial_init grants commercial_rw / SELECT only to runtime roles that exist
      - name: Create runtime roles
        run: |
          APP_PW=$(openssl rand -hex 32)
          FOUNDER_PW=$(openssl rand -hex 32)
          PSQL="psql postgresql://postgres:test@localhost:5437/ventora_commercial_test"
          $PSQL -c "CREATE ROLE app_runtime WITH LOGIN PASSWORD '${APP_PW}' NOINHERIT"
          $PSQL -c "CREATE ROLE founder_runtime WITH LOGIN PASSWORD '${FOUNDER_PW}' NOINHERIT"
          echo "APP_PW=${APP_PW}" >> $GITHUB_ENV
          echo "FOUNDER_PW=${FOUNDER_PW}" >> $GITHUB_ENV
      # Lot 3.2: the Founder contracts need a real Founder session (founder_identity) and write
      # their audit rows (audit) — applied before the commercial migrations, on the same clean DB
      - run: pnpm --filter @ventora/identity generate
      - run: pnpm --filter @ventora/organizations generate
      - name: Apply identity, founder and audit migrations
        run: |
          PSQL="psql postgresql://postgres:test@localhost:5437/ventora_commercial_test -v ON_ERROR_STOP=1"
          # same order as scripts/test-db-up.mjs (identity DB): founder and audit before M4
          for f in core/identity/prisma/identity/migrations/20261025000001_identity_init/migration.sql \
                   core/identity/prisma/identity/migrations/20261027000002_session_active_org/migration.sql \
                   core/identity/prisma/founder/migrations/20261025000001_founder_init/migration.sql \
                   core/audit/prisma/migrations/20261028000001_audit_init/migration.sql \
                   core/identity/prisma/identity/migrations/20261028000004_founder_owner_recovery/migration.sql \
                   core/identity/prisma/identity/migrations/20261029000006_lot26_open_last_organization/migration.sql; do
            echo "Applying $f"
            $PSQL -f "$f"
          done
      - name: Apply commercial migrations
        run: |
          PSQL="psql postgresql://postgres:test@localhost:5437/ventora_commercial_test -v ON_ERROR_STOP=1"
          for f in core/commercial/prisma/migrations/*/migration.sql; do
            echo "Applying $f"
            $PSQL -f "$f"
          done
      - name: Generate test secrets
        run: |
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "FOUNDER_AUTH_SECRET=$(openssl rand -hex 32)" >> $GITHUB_ENV
      - name: Run commercial integration tests
        env:
          DATABASE_URL_TEST: postgresql://app_runtime:${{ env.APP_PW }}@localhost:5437/ventora_commercial_test
          DATABASE_URL_FOUNDER_TEST: postgresql://founder_runtime:${{ env.FOUNDER_PW }}@localhost:5437/ventora_commercial_test
          DATABASE_URL_ADMIN_TEST: postgresql://postgres:test@localhost:5437/ventora_commercial_test
          BETTER_AUTH_SECRET: ${{ env.BETTER_AUTH_SECRET }}
          FOUNDER_AUTH_SECRET: ${{ env.FOUNDER_AUTH_SECRET }}
        run: pnpm --filter @ventora/commercial test:integration
      # The real manifests, twice: the second run fails if it changes anything
      - name: Sync the registry from the manifests (twice)
        env:
          DIRECT_URL: postgresql://postgres:test@localhost:5437/ventora_commercial_test
        run: |
          pnpm tsx scripts/sync-commercial-registry.ts
          pnpm tsx scripts/sync-commercial-registry.ts --expect-noop

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      [
        quality,
        test,
        integration-tests,
        integration-tests-identity,
        integration-tests-organizations,
        integration-tests-access,
        integration-tests-audit,
        integration-tests-commercial,
      ]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ventora/identity generate
      - run: pnpm --filter @ventora/organizations generate
      - run: pnpm --filter @ventora/access generate
      - run: pnpm build
        env:
          NEXT_PUBLIC_PLATFORM_URL: http://localhost:3100
          NEXT_PUBLIC_PORTAL_URL: http://localhost:3101
          NEXT_PUBLIC_FOUNDER_URL: http://localhost:3102

  smoke-test:
    name: Smoke test /design (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @ventora/platform exec playwright install chromium --with-deps
      - name: Run smoke tests
        run: pnpm --filter @ventora/platform test:e2e --project=chromium
        env:
          NODE_ENV: development
          NEXT_PUBLIC_PLATFORM_URL: http://localhost:3100
          NEXT_PUBLIC_PORTAL_URL: http://localhost:3101
          NEXT_PUBLIC_FOUNDER_URL: http://localhost:3102

  visual-check:
    name: Verificare vizuală design ↔ implementare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @ventora/platform exec playwright install chromium --with-deps
      - name: Pornește serverul de dev (platform)
        run: |
          pnpm --filter @ventora/platform dev > dev-server.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://localhost:3100/design/preview/Button && exit 0
            sleep 2
          done
          cat dev-server.log
          exit 1
        env:
          NODE_ENV: development
          NEXT_PUBLIC_PLATFORM_URL: http://localhost:3100
          NEXT_PUBLIC_PORTAL_URL: http://localhost:3101
          NEXT_PUBLIC_FOUNDER_URL: http://localhost:3102
      - name: Diff design ↔ implementare (pragul din scripts/visual-check.config.json)
        run: node scripts/visual-check.mjs
      - name: Capturi și diff-uri
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-check
          path: visual-check/
          retention-days: 14

  smoke-test-prod-guard:
    name: Smoke test prod guard (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @ventora/platform exec playwright install chromium --with-deps
      - name: Build platform (producție)
        run: pnpm --filter @ventora/platform build
        env:
          NEXT_PUBLIC_PLATFORM_URL: http://localhost:3101
          NEXT_PUBLIC_PORTAL_URL: http://localhost:3101
          NEXT_PUBLIC_FOUNDER_URL: http://localhost:3102
      - name: Run prod-guard smoke tests
        run: pnpm --filter @ventora/platform test:e2e --project=prod-guard
        env:
          CI_PROD_GUARD: '1'
          NEXT_PUBLIC_PLATFORM_URL: http://localhost:3101
          NEXT_PUBLIC_PORTAL_URL: http://localhost:3101
          NEXT_PUBLIC_FOUNDER_URL: http://localhost:3102
