name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  TURBO_TELEMETRY_DISABLED: 1
  NODE_ENV: test

jobs:
  secrets-scan:
    name: Scan for secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  guards-verify:
    name: Verify architectural guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install gitleaks v8.30.1
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar xz -C /usr/local/bin gitleaks
          gitleaks version
      - run: pnpm install --frozen-lockfile
      - run: pnpm guards:verify

  quality:
    name: Lint · Typecheck · Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ventora/identity generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration-tests:
    name: Integration tests (T1 + T2)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ventora_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ventora/db-kit test:integration
        env:
          DATABASE_URL_TEST: postgresql://postgres:test@localhost:5432/ventora_test

  integration-tests-identity:
    name: Integration tests (identity — T1)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ventora_identity_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ventora/identity generate
      - name: Generate test secrets
        run: |
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "FOUNDER_AUTH_SECRET=$(openssl rand -hex 32)" >> $GITHUB_ENV
      - name: Apply identity migration
        run: pnpm --filter @ventora/identity db:migrate:identity
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5433/ventora_identity_test
      - name: Apply founder migration
        run: pnpm --filter @ventora/identity db:migrate:founder
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5433/ventora_identity_test
      - name: Set runtime role passwords and start pgbouncer
        run: |
          APP_PW=$(openssl rand -hex 32)
          FOUNDER_PW=$(openssl rand -hex 32)
          PSQL="psql postgresql://postgres:test@localhost:5433/ventora_identity_test"
          $PSQL -c "ALTER ROLE app_runtime WITH PASSWORD '${APP_PW}'"
          $PSQL -c "ALTER ROLE founder_runtime WITH PASSWORD '${FOUNDER_PW}'"

          # Install pgbouncer for transaction-pooler isolation test (T1.14)
          sudo apt-get install -y pgbouncer
          # apt starts the system pgbouncer service on port 6432 via systemd — stop it
          # so our custom instance can bind the same port.
          sudo systemctl stop pgbouncer || true

          # pgbouncer 1.22+ (ubuntu noble) requires auth_file even for auth_type=trust.
          # List app_runtime with its plaintext password so pgbouncer can also use it
          # for SCRAM-SHA-256 server-side auth (PostgreSQL 17 default).
          printf '"app_runtime" "%s"\n' "${APP_PW}" > /tmp/pgbouncer_users.txt

          cat > /tmp/pgbouncer.ini << PBEOF
          [databases]
          ventora_identity_test = host=127.0.0.1 port=5433 dbname=ventora_identity_test user=app_runtime

          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = 6432
          auth_type = trust
          auth_file = /tmp/pgbouncer_users.txt
          pool_mode = transaction
          max_client_conn = 100
          default_pool_size = 10
          pidfile = /tmp/pgbouncer.pid
          PBEOF

          pgbouncer -d /tmp/pgbouncer.ini
          sleep 2
          # Fail fast if pgbouncer is not accepting connections
          psql "postgresql://app_runtime:${APP_PW}@localhost:6432/ventora_identity_test" -c "SELECT 1" || { echo "pgbouncer health-check failed"; cat /tmp/pgbouncer.ini; exit 1; }

          echo "DATABASE_URL_TEST=postgresql://app_runtime:${APP_PW}@localhost:5433/ventora_identity_test" >> $GITHUB_ENV
          echo "DATABASE_URL_FOUNDER_TEST=postgresql://founder_runtime:${FOUNDER_PW}@localhost:5433/ventora_identity_test" >> $GITHUB_ENV
          echo "DATABASE_URL_APP_RUNTIME=postgresql://app_runtime:${APP_PW}@localhost:5433/ventora_identity_test" >> $GITHUB_ENV
          echo "DATABASE_URL_PGBOUNCER_TEST=postgresql://app_runtime:${APP_PW}@localhost:6432/ventora_identity_test" >> $GITHUB_ENV
          echo "DATABASE_URL_ADMIN_TEST=postgresql://postgres:test@localhost:5433/ventora_identity_test" >> $GITHUB_ENV
      - run: pnpm --filter @ventora/identity test:integration
        env:
          BETTER_AUTH_SECRET: ${{ env.BETTER_AUTH_SECRET }}
          FOUNDER_AUTH_SECRET: ${{ env.FOUNDER_AUTH_SECRET }}
          DATABASE_URL_TEST: ${{ env.DATABASE_URL_TEST }}
          DATABASE_URL_FOUNDER_TEST: ${{ env.DATABASE_URL_FOUNDER_TEST }}
          DATABASE_URL_APP_RUNTIME: ${{ env.DATABASE_URL_APP_RUNTIME }}
          DATABASE_URL_PGBOUNCER_TEST: ${{ env.DATABASE_URL_PGBOUNCER_TEST }}
          DATABASE_URL_ADMIN_TEST: ${{ env.DATABASE_URL_ADMIN_TEST }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, test, integration-tests, integration-tests-identity]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_PLATFORM_URL: http://localhost:3100
          NEXT_PUBLIC_PORTAL_URL: http://localhost:3101
          NEXT_PUBLIC_FOUNDER_URL: http://localhost:3102
