name: CI

on:
  push:
    branches: [main, develop, f1-design-system]
  pull_request:
    branches: [main, develop]

env:
  TURBO_TELEMETRY_DISABLED: 1
  NODE_ENV: test

jobs:
  secrets-scan:
    name: Scan for secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  guards-verify:
    name: Verify architectural guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install gitleaks v8.30.1
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar xz -C /usr/local/bin gitleaks
          gitleaks version
      - run: pnpm install --frozen-lockfile
      - run: pnpm guards:verify

  quality:
    name: Lint · Typecheck · Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ventora/identity generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration-tests:
    name: Integration tests (T1 + T2)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ventora_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ventora/db-kit test:integration
        env:
          DATABASE_URL_TEST: postgresql://postgres:test@localhost:5432/ventora_test

  integration-tests-identity:
    name: Integration tests (identity — T1)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ventora_identity_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ventora/identity generate
      - name: Generate test secrets
        run: |
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "FOUNDER_AUTH_SECRET=$(openssl rand -hex 32)" >> $GITHUB_ENV
      - run: pnpm --filter @ventora/identity test:integration
        env:
          DATABASE_URL_TEST: postgresql://postgres:test@localhost:5433/ventora_identity_test
          DATABASE_URL_FOUNDER_TEST: postgresql://postgres:test@localhost:5433/ventora_identity_test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, test, integration-tests, integration-tests-identity]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_PLATFORM_URL: http://localhost:3100
          NEXT_PUBLIC_PORTAL_URL: http://localhost:3101
          NEXT_PUBLIC_FOUNDER_URL: http://localhost:3102

  smoke-test:
    name: Smoke test /design (Playwright)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @ventora/platform exec playwright install chromium --with-deps
      - name: Run smoke tests
        run: pnpm --filter @ventora/platform test:e2e --project=chromium
        env:
          NODE_ENV: development
          NEXT_PUBLIC_PLATFORM_URL: http://localhost:3100
          NEXT_PUBLIC_PORTAL_URL: http://localhost:3101
          NEXT_PUBLIC_FOUNDER_URL: http://localhost:3102

  smoke-test-prod-guard:
    name: Smoke test prod guard (Playwright)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @ventora/platform exec playwright install chromium --with-deps
      - name: Build platform (producție)
        run: pnpm --filter @ventora/platform build
        env:
          NEXT_PUBLIC_PLATFORM_URL: http://localhost:3101
          NEXT_PUBLIC_PORTAL_URL: http://localhost:3101
          NEXT_PUBLIC_FOUNDER_URL: http://localhost:3102
      - name: Run prod-guard smoke tests
        run: pnpm --filter @ventora/platform test:e2e --project=prod-guard
        env:
          CI_PROD_GUARD: '1'
          NEXT_PUBLIC_PLATFORM_URL: http://localhost:3101
          NEXT_PUBLIC_PORTAL_URL: http://localhost:3101
          NEXT_PUBLIC_FOUNDER_URL: http://localhost:3102
