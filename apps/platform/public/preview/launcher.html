<!doctype html>
<html lang="ro" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HubLauncher — Ventora (design aprobat)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Syne:wght@400..800&display=swap">
<link rel="stylesheet" href="/preview/tokens.css">
<link rel="stylesheet" href="/preview/bundle.css">
<style>
html,body{height:100%;margin:0;background:var(--canvas);color:var(--ink)}
#root{height:100%}
.display-l{font-family:var(--type-display-l-family);font-size:var(--type-display-l-size);line-height:var(--type-display-l-line);font-weight:var(--type-display-l-weight);letter-spacing:-0.015em}
.display-m{font-family:var(--type-display-m-family);font-size:var(--type-display-m-size);line-height:var(--type-display-m-line);font-weight:var(--type-display-m-weight);letter-spacing:-0.01em}
.body{font-family:var(--type-body-family);font-size:var(--type-body-size);line-height:var(--type-body-line);font-weight:var(--type-body-weight)}
.body-small{font-family:var(--type-body-small-family);font-size:var(--type-body-small-size);line-height:var(--type-body-small-line);font-weight:var(--type-body-small-weight)}
.caption{font-family:var(--type-caption-family);font-size:var(--type-caption-size);line-height:var(--type-caption-line);font-weight:var(--type-caption-weight)}
.muted{color:var(--ink-muted)}
.daylinks .v-link{font-weight:500}
.frame-rel{position:relative;height:100%}
.wrap{max-width:1120px;width:100%;margin:0 auto;padding:var(--space-6) var(--space-6) var(--space-10);display:flex;flex-direction:column;gap:var(--space-8);box-sizing:border-box}
.greet{display:flex;flex-direction:column;gap:var(--space-2)}
.sec{margin-bottom:var(--space-3)}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);margin-bottom:var(--space-3);flex-wrap:wrap}
.tiles4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-4)}
.rows{display:flex;flex-direction:column;background:var(--sheet);border:var(--border-width) solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.rows2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-2)}
</style>
</head>
<body>
<div id="root" style="height:100vh"></div>
<script src="/preview/bundle.js"></script>
<script>
const V = window.Ventora;
const { useState } = React;
const mount = (el) => ReactDOM.createRoot(document.getElementById("root")).render(
  React.createElement(V.LocaleProvider, { locale: "ro" }, el)
);
const ORGS = [
  { id: "aurora", name: "Salon Aurora", role: "Proprietar" },
  { id: "dentis", name: "Clinica Dentis Sibiu", role: "Recepție" }
];
const NOTIFS = [
  { id: 1, title: "Programare nouă de la Ana Popescu", body: "Joi, 29 oct., 14:30 \xB7 Tuns", app: "Booking", time: "acum 5 min", person: "Ana Popescu" },
  { id: 2, title: "Factura #2026-114 e restantă de 3 zile", body: "Clinica Dentis \xB7 1.250 lei", app: "Finance", time: "acum 2 ore", icon: "receipt" }
];
const USER = { name: "Bianca Petrașcu", email: "bianca@ventora-hub.com" };
const MINE = [
  ["booking", "Programări, calendar și reamintiri", 3],
  ["crm", "Clienți, istoric și oportunități"],
  ["hr", "Echipă, prezență și concedii", 1],
  ["finance", "Facturi, scadențe și restanțe", 2],
  ["projects", "Proiecte, sarcini și termene"],
  ["shifts", "Ture și \xEEnlocuiri"],
  ["documents", "Documente și șabloane"],
  ["portal", "Pagina afacerii pentru clienți"]
];
const OTHER = [
  ["inventory", "unavailable"],
  ["analytics", "notInRole"],
  ["marketing", "notInPlan"],
  ["network", "notInPlan"]
];
function Launcher() {
  const [run, setRun] = useState(null);
  const open = (a) => (e) => {
    const icon = e.currentTarget.querySelector(".v-appicon");
    setRun({ app: a, from: icon ? icon.getBoundingClientRect() : e.currentTarget.getBoundingClientRect() });
  };
  return React.createElement("div", { className: "frame-rel" },
    React.createElement(V.AppShell, { height: "100%",
      contextBar: React.createElement(V.ContextBar, {
        leading: React.createElement("span", { style: { padding: "0 var(--space-2)" } }, React.createElement(V.Logo, { size: 32 })),
        org: React.createElement(V.OrgSwitcher, { orgs: ORGS, currentId: "aurora" }),
        onSearch: () => {},
        notifications: React.createElement(V.NotificationsPanel, { items: NOTIFS }),
        account: React.createElement(V.AccountMenu, { user: USER, orgs: ORGS, currentOrgId: "aurora", onCatalog: () => {} })
      })
    },
      React.createElement("div", { className: "wrap desktop" },
        React.createElement("div", { className: "greet" },
          React.createElement("h1", { className: "display-l" }, "Bună dimineața, Bianca"),
          React.createElement("p", { className: "body muted daylinks" },
            "Azi ai ",
            React.createElement("a", { className: "v-link", href: "#" }, "8 programări"),
            ", ",
            React.createElement("a", { className: "v-link", href: "#" }, "2 facturi scadente"),
            " și ",
            React.createElement("a", { className: "v-link", href: "#" }, "o cerere de concediu"),
            " de aprobat."
          )
        ),
        React.createElement("section", null,
          React.createElement("div", { className: "sechead" },
            React.createElement("h2", { className: "display-m" }, "Aplicațiile tale"),
            React.createElement(V.Button, { size: "sm", variant: "quiet", icon: "grip-vertical" }, "Reordonează")
          ),
          React.createElement("div", { className: "tiles4" },
            MINE.map(([a, d, b]) =>
              React.createElement(V.AppTile, { key: a, app: a, description: d, badge: b, onOpen: open(a) })
            )
          )
        ),
        React.createElement("section", null,
          React.createElement("h2", { className: "display-m sec" }, "Alte aplicații Ventora"),
          React.createElement("p", { className: "body-small muted", style: { marginBottom: "var(--space-3)" } },
            "Nu le poți deschide acum. La fiecare scrie de ce și ce poți face."
          ),
          React.createElement("div", { className: "rows rows2" },
            OTHER.map(([a, s]) =>
              React.createElement(V.AppTile, { key: a, app: a, access: s, layout: "row",
                grantedBy: "Bianca Petrașcu",
                onRequestAccess: () => {},
                onWriteUs: () => {},
                onSeeStatus: () => {}
              })
            )
          )
        )
      )
    ),
    run && React.createElement(V.AppLaunch, { contained: true, app: run.app, from: run.from,
      onDone: () => setTimeout(() => setRun(null), 500)
    })
  );
}
mount(React.createElement(Launcher, null));
</script>
</body>
</html>
