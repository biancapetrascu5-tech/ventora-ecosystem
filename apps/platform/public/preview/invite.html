.body-small{font-family:var(--type-body-small-family);font-size:var(--type-body-small-size);line-height:var(--type-body-small-line);font-weight:var(--type-body-small-weight)}
.caption{font-family:var(--type-caption-family);font-size:var(--type-caption-size);line-height:var(--type-caption-line);font-weight:var(--type-caption-weight)}
.muted{color:var(--ink-muted)}.center{text-align:center}
</style>
